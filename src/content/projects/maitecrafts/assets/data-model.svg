<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Simplified relational and dynamic data model</title><desc id="desc">An order has many items. Each item references a product type and production stage, and has status history. Field definitions can apply to several product types.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7552CB"/></marker></defs><rect x="0" y="0" width="1000" height="550" rx="0" fill="#FAF9FC" stroke="#FAF9FC"/><text x="40" y="43" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7552CB">02 / DATA MODEL</text><text x="40" y="83" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#242338">Stable relationships, flexible attributes</text><text x="40" y="115" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#757187">A simplified model of the production domain.</text><rect x="40" y="160" width="270" height="118" rx="14" fill="white" stroke="#DDD7E8"/><text x="60" y="194" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">Order</text><text x="60" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Unique serial number</text><text x="60" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Client + order data: JSON</text><rect x="390" y="160" width="270" height="118" rx="14" fill="#EEE8FA" stroke="#DDD7E8"/><text x="410" y="194" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">OrderItem</text><text x="410" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Quantity + product data</text><text x="410" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Its own production stage</text><path d="M310 218 L385 218" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><text x="324" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#7552CB">1:N</text><rect x="730" y="160" width="230" height="118" rx="14" fill="white" stroke="#DDD7E8"/><text x="750" y="194" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">ProductionStage</text><text x="750" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Label + position</text><text x="750" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Skip / archive rules</text><path d="M660 218 L725 218" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><text x="679" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#7552CB">N:1</text><rect x="390" y="346" width="270" height="118" rx="14" fill="white" stroke="#DDD7E8"/><text x="410" y="380" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">ProductType</text><text x="410" y="411" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">T-shirt, mug, …</text><text x="410" y="436" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Configurable in admin</text><path d="M525 278 L525 341" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><text x="537" y="317" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#7552CB">N:1</text><rect x="40" y="346" width="270" height="118" rx="14" fill="white" stroke="#DDD7E8"/><text x="60" y="380" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">FieldDefinition</text><text x="60" y="411" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Key + type + required</text><text x="60" y="436" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Shared across types</text><path d="M310 403 L385 403" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><text x="320" y="390" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#7552CB">N:M</text><rect x="730" y="346" width="230" height="118" rx="14" fill="white" stroke="#DDD7E8"/><text x="750" y="380" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">StatusHistory</text><text x="750" y="411" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">From / to stage</text><text x="750" y="436" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Who + when</text><path d="M660 270 L790 341" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><text x="711" y="303" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#7552CB">1:N</text><text x="40" y="514" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Field definitions describe JSON values; those values are not separate relational entities.</text></svg>