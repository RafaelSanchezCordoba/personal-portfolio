<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Product state change and transaction boundary</title><desc id="desc">Authorize, resolve the applicable stage, commit item and history together, then evaluate notifications and order timestamps outside the transaction.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7552CB"/></marker></defs><rect x="0" y="0" width="1000" height="530" rx="0" fill="#FAF9FC" stroke="#FAF9FC"/><text x="40" y="43" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7552CB">03 / STATE CHANGE</text><text x="40" y="83" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#242338">Save the movement and its history together</text><text x="40" y="115" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#757187">One item moves; the order reflects the progress of all its items.</text><rect x="40" y="170" width="215" height="130" rx="14" fill="white" stroke="#DDD7E8"/><text x="60" y="204" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">1. Request</text><text x="60" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Tap or drag</text><text x="60" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Check session</text><path d="M255 237 L270 237" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><rect x="275" y="170" width="215" height="130" rx="14" fill="white" stroke="#DDD7E8"/><text x="295" y="204" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">2. Resolve</text><text x="295" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Find target stage</text><text x="295" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Apply skip rules</text><path d="M490 237 L505 237" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><rect x="510" y="170" width="215" height="130" rx="14" fill="#EEE8FA" stroke="#DDD7E8"/><text x="530" y="204" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">3. Commit</text><text x="530" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Update item</text><text x="530" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Insert history</text><path d="M725 237 L740 237" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><rect x="745" y="170" width="215" height="130" rx="14" fill="white" stroke="#DDD7E8"/><text x="765" y="204" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">4. Follow up</text><text x="765" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Evaluate alerts</text><text x="765" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Sync order dates</text><rect x="40" y="344" width="920" height="92" rx="14" fill="#F0EDF5" stroke="#F0EDF5"/><text x="62" y="380" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242338">Transaction boundary: item update + history insert.</text><text x="62" y="410" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#757187">Notifications and order timestamps run afterwards, outside that transaction.</text><text x="40" y="490" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#757187">The board refreshes after the action; other open clients pick up changes by polling.</text></svg>