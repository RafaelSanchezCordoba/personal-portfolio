<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1190" viewBox="0 0 1340 1190" role="img" aria-labelledby="title desc"><title id="title">UML sequence diagram for changing a product stage</title><desc id="desc">Lifelines for browser, server action, PostgreSQL, notification rules and CallMeBot. The item update and history insert share a transaction; notifications and order timestamps follow the commit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#74859B"/></marker><marker id="one" viewBox="0 0 20 20" refX="19" refY="10" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M4 2 V18 M10 2 V18" fill="none" stroke="#74859B" stroke-width="1.4"/></marker><marker id="many" viewBox="0 0 30 20" refX="29" refY="10" markerWidth="24" markerHeight="16" orient="auto-start-reverse"><path d="M29 2 L15 10 L29 18" fill="none" stroke="#74859B" stroke-width="1.4"/><circle cx="6" cy="10" r="4" fill="white" stroke="#74859B" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563EB" font-weight="700" text-anchor="start">BEHAVIOUR / UML SEQUENCE DIAGRAM</text><text x="40" y="73" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#172B4D" font-weight="700" text-anchor="start">Move a product to its next applicable stage</text><text x="40" y="103" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526581" font-weight="400" text-anchor="start">Normal success path for one item. Commit precedes notification checks and order timestamp updates.</text><rect x="30" y="142" width="170" height="46" rx="0" fill="#EEF3FA" stroke="#94A3B8" stroke-width="1.5"/><text x="115" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="middle">Browser</text><path d="M115 188 V1070" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="280" y="142" width="170" height="46" rx="0" fill="#EEF3FA" stroke="#94A3B8" stroke-width="1.5"/><text x="365" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="middle">Server Action</text><path d="M365 188 V1070" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="580" y="142" width="170" height="46" rx="0" fill="#EEF3FA" stroke="#94A3B8" stroke-width="1.5"/><text x="665" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="middle">PostgreSQL</text><path d="M665 188 V1070" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="880" y="142" width="170" height="46" rx="0" fill="#EEF3FA" stroke="#94A3B8" stroke-width="1.5"/><text x="965" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="middle">Notification rules</text><path d="M965 188 V1070" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="1135" y="142" width="170" height="46" rx="0" fill="#EEF3FA" stroke="#94A3B8" stroke-width="1.5"/><text x="1220" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="middle">CallMeBot</text><path d="M1220 188 V1070" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="359" y="221" width="12" height="763" rx="0" fill="#DDE8FC" stroke="#7C9EC9" stroke-width="1.5"/><rect x="659" y="414" width="12" height="217" rx="0" fill="#DDE8FC" stroke="#7C9EC9" stroke-width="1.5"/><path d="M115 226 H359" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="237.0" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">advance(itemId)</text><path d="M371 267 H403 V301 H371" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="417" y="276" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B4D" font-weight="400" text-anchor="start">requireUser()</text><text x="417" y="300" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">Validate session</text><path d="M371 347 H665" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="518.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Read item + ordered stages</text><path d="M665 389 H371" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="518.0" y="377" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Current state + stage configuration</text><rect x="305" y="411" width="440" height="239" rx="0" fill="none" stroke="#526581" stroke-width="1.5"/><rect x="305" y="411" width="115" height="30" rx="0" fill="white" stroke="#526581" stroke-width="1.5"/><text x="319" y="432" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172B4D" font-weight="700" text-anchor="start">transaction</text><text x="432" y="443" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#526581" font-weight="400" text-anchor="start">Target resolved from stage rules</text><path d="M371 478 H659" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="515.0" y="466" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">UPDATE OrderItem.stageId</text><path d="M371 541 H659" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="515.0" y="529" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">INSERT status history</text><path d="M659 609 H371" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="515.0" y="597" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">COMMIT</text><path d="M371 698 H965" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="668.0" y="686" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">checkStageNotifications(...)</text><path d="M965 753 H1220" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1092.5" y="741" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Matching rule: send</text><path d="M1220 813 H965" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="1092.5" y="801" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Delivery result / caught error</text><path d="M965 859 H371" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="668.0" y="847" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Notification check finished</text><path d="M371 921 H665" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="518.0" y="909" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Synchronise order timestamps</text><path d="M665 964 H371" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="518.0" y="952" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Updated order state</text><path d="M359 1022 H115" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="237.0" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Return + invalidate Kanban query</text><text x="40" y="1121" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526581" font-weight="400" text-anchor="start">A caught message-delivery error does not roll back the saved movement. Requests still await notification attempts.</text><text x="40" y="1152" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526581" font-weight="400" text-anchor="start">The transaction covers one item and its history. Group movements call the item logic repeatedly; they are not one batch transaction.</text></svg>