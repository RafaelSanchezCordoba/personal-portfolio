<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Maitecrafts application architecture</title><desc id="desc">The browser polls Next.js. Server logic accesses PostgreSQL with Prisma, accepts signed WooCommerce webhooks, stores photos and sends WhatsApp notifications.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7552CB"/></marker></defs><rect x="0" y="0" width="1000" height="550" rx="0" fill="#FAF9FC" stroke="#FAF9FC"/><text x="40" y="43" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7552CB">01 / ARCHITECTURE</text><text x="40" y="83" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#242338">A compact application, clear boundaries</text><text x="40" y="115" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#757187">The core workflow stays together; external services have specific jobs.</text><rect x="40" y="162" width="270" height="114" rx="14" fill="white" stroke="#DDD7E8"/><text x="60" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">Workshop browser</text><text x="60" y="227" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">React + TanStack Query</text><text x="60" y="252" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Polling every 4 seconds</text><rect x="390" y="162" width="265" height="114" rx="14" fill="#EEE8FA" stroke="#DDD7E8"/><text x="410" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">Next.js application</text><text x="410" y="227" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Server Actions</text><text x="410" y="252" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Session and role checks</text><path d="M310 218 L385 218" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="162" width="240" height="114" rx="14" fill="white" stroke="#DDD7E8"/><text x="740" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">PostgreSQL</text><text x="740" y="227" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Prisma data access</text><text x="740" y="252" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Orders + configuration</text><path d="M655 218 L715 218" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="340" width="270" height="114" rx="14" fill="white" stroke="#DDD7E8"/><text x="60" y="374" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">WooCommerce</text><text x="60" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Signed order webhook</text><text x="60" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Processing orders only</text><path d="M310 390 L385 260" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="340" width="265" height="114" rx="14" fill="white" stroke="#DDD7E8"/><text x="410" y="374" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">Image storage</text><text x="410" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Browser compression</text><text x="410" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Vercel Blob uploads</text><path d="M522 276 L522 335" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="340" width="240" height="114" rx="14" fill="white" stroke="#DDD7E8"/><text x="740" y="374" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#242338">WhatsApp</text><text x="740" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Notification rules</text><text x="740" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">CallMeBot adapter</text><path d="M655 265 L765 335" fill="none" stroke="#7552CB" stroke-width="2" marker-end="url(#a)"/><text x="40" y="512" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#757187">Simplified code architecture. The webhook validates HMAC instead of a user session.</text></svg>