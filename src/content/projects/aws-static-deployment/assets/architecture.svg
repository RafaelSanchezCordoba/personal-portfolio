<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1160" viewBox="0 0 1300 1160" role="img" aria-labelledby="title desc"><title id="title">Secure static site architecture on AWS</title><desc id="desc">GitHub Actions builds the Astro site and authenticates to AWS through an IAM OIDC provider and role, then syncs to a private S3 bucket and invalidates a CloudFront distribution. CloudFront reads S3 through Origin Access Control, serves an ACM certificate from us-east-1, and is reached through a Cloudflare CNAME for aws.rafasanchez.dev.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#74859B"/></marker><marker id="stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B91C1C"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563EB" font-weight="700" text-anchor="start">ARCHITECTURE / SERVICE VIEW</text><text x="40" y="73" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#172B4D" font-weight="700" text-anchor="start">Secure static site on AWS · build, delivery and DNS</text><text x="40" y="103" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526581" font-weight="400" text-anchor="start">Resources defined in infrastructure/*.tf. Arrows show requests or data flow.</text><rect x="40" y="150" width="500" height="330" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="62" y="182" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172B4D" font-weight="700" text-anchor="start">GITHUB</text><rect x="68" y="198" width="220" height="91" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="86" y="232" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Developer</text><text x="86" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">Local commit</text><text x="86" y="277" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">git push</text><rect x="312" y="198" width="220" height="91" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="330" y="232" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">GitHub repository</text><text x="330" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">personal-portfolio</text><text x="330" y="277" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">aws-deployment</text><path d="M288 247 H304" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="68" y="340" width="464" height="91" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="86" y="374" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">GitHub Actions · Deploy to AWS</text><text x="86" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">ubuntu-latest · Node 22</text><text x="86" y="419" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">npm ci → npm run build → dist/</text><path d="M420 296 V334" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="436" y="320" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">push trigger</text><rect x="760" y="150" width="500" height="330" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="782" y="182" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172B4D" font-weight="700" text-anchor="start">AWS ACCOUNT · IAM (GLOBAL)</text><rect x="788" y="198" width="444" height="91" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="806" y="232" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">IAM OIDC provider</text><text x="806" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">token.actions.githubusercontent.com</text><text x="806" y="277" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">aud: sts.amazonaws.com</text><rect x="788" y="340" width="444" height="112" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="806" y="374" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">IAM role · github-actions-portfolio</text><text x="806" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">Trust policy: aud + sub conditions</text><text x="806" y="419" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">s3:PutObject · s3:DeleteObject · s3:ListBucket</text><text x="806" y="440" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">cloudfront:CreateInvalidation</text><path d="M1010 296 V334" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1026" y="320" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">trusts</text><path d="M532 380 H780" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="656" y="368" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">OIDC ID token</text><path d="M780 416 H532" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="656" y="438" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Temporary credentials</text><rect x="40" y="520" width="1220" height="310" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="62" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172B4D" font-weight="700" text-anchor="start">AWS ACCOUNT · CONTENT DELIVERY</text><rect x="68" y="568" width="410" height="232" rx="0" fill="#FBFDFF" stroke="#B6C4D6" stroke-width="1.5" stroke-dasharray="7 5"/><text x="90" y="600" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="700" text-anchor="start">REGION eu-north-1</text><rect x="96" y="610" width="354" height="112" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="114" y="644" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Amazon S3</text><text x="114" y="668" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">personal-portfolio-aws-rsdev</text><text x="114" y="689" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">Public Access Block: all true</text><text x="114" y="710" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">Bucket policy: CloudFront ARN only</text><rect x="520" y="610" width="290" height="112" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="538" y="644" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Amazon CloudFront</text><text x="538" y="668" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">Distribution · global edge</text><text x="538" y="689" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">default_root_object: index.html</text><text x="538" y="710" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">redirect-to-https · TLS 1.2_2021</text><rect x="882" y="568" width="352" height="232" rx="0" fill="#FBFDFF" stroke="#B6C4D6" stroke-width="1.5" stroke-dasharray="7 5"/><text x="904" y="600" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="700" text-anchor="start">REGION us-east-1</text><rect x="910" y="610" width="296" height="112" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="928" y="644" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">ACM certificate</text><text x="928" y="668" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">aws.rafasanchez.dev</text><text x="928" y="689" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">validation_method = DNS</text><text x="928" y="710" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">Required here by CloudFront</text><path d="M516 660 H458" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="485" y="598" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">OAC</text><path d="M906 660 H818" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="846" y="598" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">TLS cert</text><path d="M300 450 V510" fill="none" stroke="#74859B" stroke-width="1.8"/><path d="M300 510 H690 V606" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M300 510 V606" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="316" y="500" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#526581" font-weight="400" text-anchor="start">aws s3 sync dist/ --delete</text><text x="706" y="500" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#526581" font-weight="400" text-anchor="start">aws cloudfront create-invalidation</text><rect x="68" y="918" width="210" height="91" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="86" y="952" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Visitor</text><text x="86" y="976" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">Browser request</text><text x="86" y="997" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">aws.rafasanchez.dev</text><rect x="330" y="870" width="610" height="150" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="352" y="902" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172B4D" font-weight="700" text-anchor="start">CLOUDFLARE DNS</text><rect x="358" y="918" width="300" height="70" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="376" y="952" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172B4D" font-weight="700" text-anchor="start">CNAME aws</text><text x="376" y="976" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">→ d3ay5auj3yddcp.cloudfront.net</text><rect x="680" y="918" width="232" height="70" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="698" y="952" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="start">ACM validation CNAME</text><text x="698" y="976" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">→ acm-validations.aws</text><path d="M282 961 H350" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="326" y="900" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="end">DNS lookup</text><path d="M498 914 V770 H690 V726" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="700" y="862" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">Resolves to the distribution</text><text x="40" y="1062" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">S3 has no public endpoint: every Public Access Block setting is true and the bucket policy admits only the CloudFront distribution ARN.</text><text x="40" y="1090" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">IAM and CloudFront are global. The bucket lives in eu-north-1; the certificate must be in us-east-1 to be usable by CloudFront.</text><text x="40" y="1118" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">GitHub Actions stores no AWS access keys. It exchanges a short-lived OIDC token for temporary credentials scoped to this deployment.</text></svg>