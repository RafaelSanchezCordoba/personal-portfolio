<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1130" viewBox="0 0 1300 1130" role="img" aria-labelledby="title desc"><title id="title">Trust and security boundaries</title><desc id="desc">GitHub stores no AWS keys and receives a short-lived OIDC token; AWS validates it against a trust policy with audience and subject conditions, grants a role limited to S3 object writes and CloudFront invalidation, and keeps the S3 bucket private behind CloudFront Origin Access Control.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#74859B"/></marker><marker id="stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B91C1C"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563EB" font-weight="700" text-anchor="start">SECURITY / TRUST BOUNDARIES</text><text x="40" y="73" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#172B4D" font-weight="700" text-anchor="start">What is trusted, and how far that trust reaches</text><text x="40" y="103" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526581" font-weight="400" text-anchor="start">Conditions and permissions as defined in infrastructure/iam.tf and infrastructure/s3.tf.</text><rect x="40" y="150" width="470" height="300" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="62" y="182" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172B4D" font-weight="700" text-anchor="start">GITHUB · NO AWS CREDENTIALS STORED</text><rect x="68" y="198" width="414" height="91" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="86" y="232" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Deploy to AWS workflow</text><text x="86" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">permissions: id-token: write</text><text x="86" y="277" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">No AWS keys in repository secrets</text><rect x="68" y="330" width="414" height="91" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="86" y="364" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Short-lived OIDC ID token</text><text x="86" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">Issued per workflow run</text><text x="86" y="409" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">token.actions.githubusercontent.com</text><path d="M275 296 V326" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="760" y="150" width="500" height="300" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="782" y="182" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172B4D" font-weight="700" text-anchor="start">AWS · IDENTITY AND TRUST</text><rect x="788" y="198" width="444" height="70" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="806" y="232" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">IAM OIDC provider</text><text x="806" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">Validates issuer and token signature</text><rect x="788" y="310" width="444" height="130" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="806" y="344" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Role trust policy</text><text x="806" y="365" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">StringEquals aud = sts.amazonaws.com</text><text x="806" y="386" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">StringLike  sub = repo:RafaelSanchezCordoba</text><text x="806" y="407" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">                   @53056368/personal-portfolio</text><text x="806" y="428" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">                   @1362535609:*</text><path d="M1010 282 V306" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M486 380 H784" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="635" y="368" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#526581" font-weight="400" text-anchor="middle">sts:AssumeRoleWithWebIdentity</text><rect x="40" y="490" width="1220" height="220" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="62" y="522" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172B4D" font-weight="700" text-anchor="start">AWS · LEAST-PRIVILEGE DEPLOY ROLE</text><rect x="68" y="540" width="380" height="112" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="86" y="574" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">IAM role</text><text x="86" y="598" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">github-actions-portfolio</text><text x="86" y="619" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">Temporary credentials</text><text x="86" y="640" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">Expire with the job</text><rect x="490" y="540" width="360" height="130" rx="0" fill="white" stroke="#86B89A" stroke-width="1.5"/><text x="508" y="574" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#15803D" font-weight="700" text-anchor="start">Allowed</text><text x="508" y="595" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">s3:ListBucket        bucket</text><text x="508" y="616" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">s3:PutObject         bucket/*</text><text x="508" y="637" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">s3:DeleteObject      bucket/*</text><text x="508" y="658" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">cloudfront:CreateInvalidation</text><rect x="890" y="540" width="342" height="130" rx="0" fill="white" stroke="#E0B4B4" stroke-width="1.5" stroke-dasharray="5 4"/><text x="908" y="574" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#B91C1C" font-weight="700" text-anchor="start">Not granted</text><text x="908" y="595" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">No IAM or account actions</text><text x="908" y="616" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">No other S3 buckets</text><text x="908" y="637" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">No CloudFront config changes</text><text x="908" y="658" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">No long-lived IAM user</text><path d="M452 620 H482" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="760" width="1220" height="230" rx="0" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="62" y="792" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172B4D" font-weight="700" text-anchor="start">AWS · CONTENT ACCESS</text><rect x="68" y="806" width="340" height="91" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="86" y="840" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">Public internet</text><text x="86" y="864" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">https://aws.rafasanchez.dev</text><text x="86" y="885" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">Reaches CloudFront only</text><rect x="490" y="806" width="360" height="91" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="508" y="840" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">CloudFront distribution</text><text x="508" y="864" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">ACM certificate · TLS 1.2_2021</text><text x="508" y="885" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">viewer_protocol_policy: https</text><rect x="930" y="806" width="302" height="91" rx="0" fill="white" stroke="#9AAABD" stroke-width="1.5"/><text x="948" y="840" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B4D" font-weight="700" text-anchor="start">S3 bucket (private)</text><text x="948" y="864" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">Public Access Block: all true</text><text x="948" y="885" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">Policy: AWS:SourceArn</text><path d="M412 856 H482" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="447" y="796" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">HTTPS</text><path d="M854 856 H922" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="888" y="796" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">OAC · SigV4</text><path d="M238 910 V955 H1081 V910" fill="none" stroke="#B91C1C" stroke-width="1.8" marker-end="url(#stop)" stroke-dasharray="6 5"/><path d="M648 945 L672 969 M672 945 L648 969" fill="none" stroke="#B91C1C" stroke-width="2.4"/><text x="660" y="935" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#B91C1C" font-weight="400" text-anchor="middle">No public path from the internet to S3</text><text x="40" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">The sub condition uses GitHub identifier form for owner and repository; the :* suffix matches any ref or environment in that repository.</text><text x="40" y="1068" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">The bucket policy allows s3:GetObject to the CloudFront service principal only, conditioned on the distribution ARN.</text><text x="40" y="1096" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">TLS terminates at CloudFront with the ACM certificate. Origin requests to S3 are signed with SigV4 through Origin Access Control.</text></svg>