<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1130" viewBox="0 0 1340 1130" role="img" aria-labelledby="title desc"><title id="title">GitHub Actions deployment sequence</title><desc id="desc">Sequence diagram: a push to the aws-deployment branch triggers the workflow, which checks out the repository, exchanges an OIDC token with AWS STS for temporary credentials, installs dependencies, builds the Astro site, syncs dist/ to S3 with --delete and creates a CloudFront invalidation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#74859B"/></marker><marker id="stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B91C1C"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563EB" font-weight="700" text-anchor="start">CI/CD / DEPLOYMENT SEQUENCE</text><text x="40" y="73" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#172B4D" font-weight="700" text-anchor="start">One push to aws-deployment</text><text x="40" y="103" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526581" font-weight="400" text-anchor="start">Steps and commands as written in .github/workflows/deploy-aws.yml.</text><rect x="25" y="142" width="170" height="46" rx="0" fill="#EEF3FA" stroke="#94A3B8" stroke-width="1.5"/><text x="110" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="middle">Developer</text><path d="M110 188 V1010" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="235" y="142" width="170" height="46" rx="0" fill="#EEF3FA" stroke="#94A3B8" stroke-width="1.5"/><text x="320" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="middle">GitHub</text><path d="M320 188 V1010" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="455" y="142" width="170" height="46" rx="0" fill="#EEF3FA" stroke="#94A3B8" stroke-width="1.5"/><text x="540" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="middle">Actions runner</text><path d="M540 188 V1010" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="715" y="142" width="170" height="46" rx="0" fill="#EEF3FA" stroke="#94A3B8" stroke-width="1.5"/><text x="800" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="middle">AWS STS</text><path d="M800 188 V1010" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="945" y="142" width="170" height="46" rx="0" fill="#EEF3FA" stroke="#94A3B8" stroke-width="1.5"/><text x="1030" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="middle">Amazon S3</text><path d="M1030 188 V1010" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="1155" y="142" width="170" height="46" rx="0" fill="#EEF3FA" stroke="#94A3B8" stroke-width="1.5"/><text x="1240" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="700" text-anchor="middle">CloudFront</text><path d="M1240 188 V1010" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="534" y="296" width="12" height="660" rx="0" fill="#DDE8FC" stroke="#7C9EC9" stroke-width="1.5"/><path d="M110 232 H314" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="212.0" y="220" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">git push origin aws-deployment</text><path d="M320 286 H528" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="424.0" y="274" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">on: push · branches: aws-deployment</text><path d="M552 318 H600 V352 H552" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="614" y="326" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#172B4D" font-weight="400" text-anchor="start">actions/checkout@v4</text><text x="614" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#526581" font-weight="400" text-anchor="start">Checkout repository</text><path d="M552 412 H796" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="674.0" y="400" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">OIDC ID token · aud sts.amazonaws.com</text><path d="M796 462 H552" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="674.0" y="450" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Temporary credentials for the role</text><rect x="370" y="516" width="340" height="152" rx="0" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="370" y="516" width="148" height="30" rx="0" fill="white" stroke="#94A3B8" stroke-width="1.5"/><text x="384" y="537" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172B4D" font-weight="700" text-anchor="start">build on runner</text><text x="392" y="582" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">actions/setup-node@v4 (Node 22)</text><text x="392" y="610" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">npm ci</text><text x="392" y="638" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#172B4D" font-weight="400" text-anchor="start">npm run build → dist/</text><path d="M552 726 H1022" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="787.0" y="714" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">aws s3 sync dist/ s3://$S3_BUCKET --delete</text><path d="M1022 782 H552" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="787.0" y="770" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Objects uploaded · removed files deleted</text><path d="M552 856 H1232" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)"/><text x="892.0" y="844" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">aws cloudfront create-invalidation --paths &quot;/*&quot;</text><path d="M1232 912 H552" fill="none" stroke="#74859B" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="892.0" y="900" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="middle">Invalidation created</text><text x="40" y="1064" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">Credentials are configured before the build step, exactly as ordered in the workflow file. They expire when the job ends.</text><text x="40" y="1092" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526581" font-weight="400" text-anchor="start">--delete removes objects that are no longer in dist/. The invalidation makes edge locations refetch on the next request.</text></svg>